name: Build APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install JS dependencies
        working-directory: litenote-mobile-app
        run: npm install --legacy-peer-deps

      - name: Write production env
        working-directory: litenote-mobile-app
        run: printf 'NODE_ENV=production\nAPI_BASE_URL=http://223.109.141.72/\nAPI_TIMEOUT=20000\nENABLE_LOGS=false\nAPP_NAME=LiteNote\nAPP_VERSION=0.0.28\nBUILD_NUMBER=28\nSENTRY_DSN=\nSENTRY_DSN_ANDROID=\n' > .env.production

      - name: Build release APK
        working-directory: litenote-mobile-app/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: litenote-apk
          path: litenote-mobile-app/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
